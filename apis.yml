name: Kabbage
description: 'Kabbage was an Atlanta-based financial technology company (founded 2009) that pioneered fully
  automated, data-driven cash-flow lending to small businesses, offering flexible lines of credit, online
  bill payment, cash-flow visualization, and business checking. It exposed a B2B "Kabbage Platform" lending-as-a-service
  API (formerly documented at kabbageplatform.com) and was backed by the SoftBank Vision Fund. American Express
  announced its acquisition of substantially all of Kabbage in August 2020; the products were folded into
  American Express Business Blueprint and the standalone Kabbage developer platform was discontinued. As of
  this enrichment pass no independent Kabbage public API, developer portal, or specification is reachable —
  kabbage.com redirects to americanexpress.com/business/blueprint and the former developer hosts no longer
  resolve.'
